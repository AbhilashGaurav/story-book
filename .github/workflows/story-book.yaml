name: Storybook Python CI/CD

on:
  schedule:
    # Every day at 9 AM UTC (change cron as needed)
    - cron: "0 23 * * *"
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'   # or your required version

      # Step 3: Install dependencies (if any)
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your script / command
      - name: Run Storybook Script
        run: |
          echo "hello oen"   # OR your one-liner command
